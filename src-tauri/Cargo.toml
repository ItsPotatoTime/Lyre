[package]
name = "lyre"
version = "0.2.0"
description = "A fast, cross-platform file manager in the Windows 11 design language."
authors = ["Lyre contributors"]
edition = "2021"
# Tauri 2.12 needs 1.90 itself, so the floor is whatever it needs rather than a
# number nobody has been able to build with for a while.
rust-version = "1.90"

[lib]
name = "lyre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed the frontend instead of loading a development URL.
# Deliberately not a default: `tauri dev` builds without default features, so
# putting it here made development and `cargo build` two different builds of the
# same crate sharing one target directory. The release build passes it
# explicitly, and build.rs refuses to produce one without it.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nucleo-matcher = "0.3.1"
tauri-plugin-drag = "2.1.1"
unicode-normalization = "0.1.26"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
tauri-plugin-updater = "2"
# Local crate, no external dependencies. Shared with the patched wry so a
# native drop can be snapshotted synchronously inside IDropTarget::Drop.
lyre-drophook = { path = "vendor/lyre-drophook" }

# Two small, documented local patches. Bump the vendored copy whenever wry or
# drag is upgraded; see docs/platforms.md#dragging-out-of-an-archive.
[patch.crates-io]
wry = { path = "vendor/wry" }
drag = { path = "vendor/drag" }

# A file manager's start-up time is a feature. Optimise hard for binary size
# and code locality rather than peak throughput.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

# Listing a directory is the hot path, and it is still slow in debug builds
# with the default opt-level = 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
