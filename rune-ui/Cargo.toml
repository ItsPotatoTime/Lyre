[package]
name = "lyre-rune"
version = "0.3.4"
edition = "2024"
description = "Experimental native Rune rendering of Lyre's Explorer shell"

[dependencies]
# Pre-release: pin a rev of dev, as Rune's README requires. dev is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false }
# The fuzzy matcher behind the old app's search (and Helix): scoring + match indices.
nucleo-matcher = "0.3.1"
# Default-manager backup + update manifest (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auto-update: HTTP check/download, signature verification, version comparison.
ureq = { version = "2", features = ["json"] }
minisign-verify = "0.2"
semver = "1"
[target.'cfg(target_os = "windows")'.dependencies]
# The shell's own drag data object and a real IDropSource, so OLE accepts the
# drag-off-the-window handoff instead of refusing a hand-written vtable.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# `#[implement]` expands to paths in this crate, so it is a real dependency.
windows-core = "0.62"
[target.'cfg(target_os = "linux")'.dependencies]
# Wayland drag-out: dlopen libwayland at runtime, as Rune itself does, so the
# Linux build needs no wayland development packages.
wayland-client = { version = "0.31", features = ["dlopen"] }

[target.'cfg(windows)'.build-dependencies]
# Compiles the application icon into the executable as a Windows resource: that
# is the icon Explorer draws for the file, and the handle the window sets on
# itself for the titlebar and taskbar. Scoped to Windows so the other platforms
# build without it.
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
