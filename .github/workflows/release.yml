name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing must not cost the others their artifacts.
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage, deb, rpm)
            os: ubuntu-22.04
            args: "-- --features custom-protocol"
          - name: Windows (msi, exe)
            os: windows-latest
            args: "-- --features custom-protocol"
          - name: macOS (universal dmg, app)
            os: macos-latest
            # build.rs refuses a release build that does not embed the
            # frontend, so the feature travels with every platform.
            args: "--target universal-apple-darwin -- --features custom-protocol"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Building on 22.04 rather than 24.04 on purpose: the AppImage links
      # against whatever glibc the runner has, so an older base is the one that
      # runs on more distributions.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add both macOS targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install the interface's dependencies
        run: bun install --frozen-lockfile

      # Creates the draft release for this tag on the first job that reaches it,
      # and adds to it from the others.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and writes latest.json beside them. Both
          # secrets are required: without the key the build refuses to produce
          # an update rather than shipping one nothing can verify. See
          # docs/updates.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lyre ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          releaseBody: |
            A fast, cross-platform file manager in the Windows 11 Explorer design
            language.

            | Platform | File |
            | --- | --- |
            | Linux | `AppImage` (no install), `deb`, `rpm` |
            | Windows | `-setup.exe` (NSIS), `msi` |
            | macOS | `dmg`, universal (Apple silicon and Intel) |

            The `deb` and `rpm` use the system's `webkit2gtk-4.1`; the AppImage
            carries its own, and needs glibc 2.35 or newer because it is built
            on Ubuntu 22.04.

            Nothing is code-signed yet. On Windows expect a SmartScreen prompt
            (More info, then Run anyway); on macOS the app is unsigned and not
            notarised, so the first launch needs a right-click and Open, or
            `xattr -d com.apple.quarantine /Applications/Lyre.app`.

            Installing from a package manager is described in
            [docs/install.md](https://github.com/ItsPotatoTime/Lyre/blob/main/docs/install.md).

      # The changelog is the release notes, so the draft is built from it rather
      # than from a second copy that can drift. One platform does the edit: three
      # of them appending to the same body would fight each other.
      - name: Put this version's changelog in the draft
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { copying = 1; next }
            copying && /^## \[/ { exit }
            copying { print }
          ' CHANGELOG.md > section.md

          if [ ! -s section.md ]; then
            echo "CHANGELOG.md has no section for $version; leaving the notes as they are."
            exit 0
          fi

          gh release view "$TAG" --json body --jq .body > body.md
          { cat body.md; printf '\n\n---\n\n## What changed in %s\n' "$version"; cat section.md; } > combined.md
          gh release edit "$TAG" --notes-file combined.md
