name: release

# Ships the native Rune crate (rune-ui/), not the old Tauri app. Each platform
# builds lyre-rune, packages the format the updater installs (NSIS setup, AppImage,
# universal .app.tar.gz), signs it with the project's minisign key, and uploads the
# installer plus a manifest fragment. The publish job merges the fragments into a
# Tauri-shaped latest.json and attaches everything to a DRAFT release; a person
# publishes it, because releases/latest/download/latest.json only resolves once
# published. The signing key is the same one the old release used, so installed
# copies keep trusting it. See docs/updates.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing must not cost the others their artifacts.
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage)
            os: ubuntu-22.04
            platform: linux
          - name: Windows (NSIS)
            os: windows-latest
            platform: windows
          - name: macOS (universal)
            os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      # The same X11/Wayland/xcb development set the crate builds against on a
      # working Linux machine; rune pulls these in through winit/wgpu. 22.04 rather
      # than 24.04 on purpose: the AppImage links the runner's glibc, so an older
      # base runs on more distributions.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -u
          # The runner's mirror has repeatedly failed to resolve
          # azure.archive.ubuntu.com, which is infrastructure rather than this
          # project. apt's own retries plus an outer loop ride that out instead of
          # failing a release on a DNS blip, and the explicit check keeps a real
          # failure a failure.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5 \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=5 \
                pkg-config libssl-dev libwayland-dev libx11-dev libx11-xcb-dev \
                libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev \
                libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
                desktop-file-utils; then
              installed=1
              break
            fi
            echo "dependency install attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "could not install the Linux build dependencies after 3 attempts"
            exit 1
          fi

      # Git for Windows puts a GNU link.exe on PATH; activate MSVC so rustc finds
      # the real one.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Add both macOS targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The Tauri CLI is only needed for `signer sign`; the lockfile pins it.
      - name: Install signing tool
        run: bun install --frozen-lockfile

      - name: Build lyre-rune
        if: matrix.platform != 'macos'
        run: cargo build --release --manifest-path rune-ui/Cargo.toml

      - name: Build lyre-rune (universal)
        if: matrix.platform == 'macos'
        run: |
          cargo build --release --manifest-path rune-ui/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path rune-ui/Cargo.toml --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/lyre-rune \
            rune-ui/target/aarch64-apple-darwin/release/lyre-rune \
            rune-ui/target/x86_64-apple-darwin/release/lyre-rune

      - name: Package (Linux AppImage)
        if: matrix.platform == 'linux'
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps" dist
          cp rune-ui/target/release/lyre-rune "$APPDIR/usr/bin/lyre-rune"
          cp packaging/rune/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/lyre-rune"
          cp packaging/rune/lyre.desktop "$APPDIR/lyre.desktop"
          cp packaging/rune/lyre.desktop "$APPDIR/usr/share/applications/lyre.desktop"
          cp packaging/icons/icon.png "$APPDIR/lyre.png"
          cp packaging/icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/lyre.png"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/Lyre_${VERSION}_amd64.AppImage"

      # The runner has no NSIS, so makensis is not on PATH and the packaging step
      # fails before it starts. Chocolatey does not reliably put it there, so the
      # install directory is appended to PATH explicitly.
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Package (Windows NSIS)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force dist | Out-Null
          # Absolute paths: makensis runs from the script's folder, so a relative
          # binary or output path would resolve inside packaging/rune/windows and
          # fail to find the build, or leave the setup where nothing uploads it.
          makensis /DVERSION=$version `
            /DBINARY="$env:GITHUB_WORKSPACE\rune-ui\target\release\lyre-rune.exe" `
            /DOUTFILE="$env:GITHUB_WORKSPACE\dist\Lyre_${version}_x64-setup.exe" `
            packaging/rune/windows/lyre.nsi

      - name: Package (macOS .app)
        if: matrix.platform == 'macos'
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/Lyre.app/Contents/MacOS dist/Lyre.app/Contents/Resources
          cp target/universal/lyre-rune dist/Lyre.app/Contents/MacOS/lyre-rune
          sed "s/@VERSION@/$VERSION/g" packaging/rune/macos/Info.plist > dist/Lyre.app/Contents/Info.plist
          cp packaging/icons/icon.icns dist/Lyre.app/Contents/Resources/icon.icns
          tar -czf dist/Lyre_universal.app.tar.gz -C dist Lyre.app

      - name: Sign (Linux)
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun scripts/rune-release.ts sign "dist/Lyre_${VERSION}_amd64.AppImage" linux-x86_64

      - name: Sign (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          bun scripts/rune-release.ts sign "dist/Lyre_${version}_x64-setup.exe" windows-x86_64

      # The universal build serves both Apple silicon and Intel, so it carries
      # both darwin keys; the updater asks for the one matching its arch.
      - name: Sign (macOS)
        if: matrix.platform == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          bun scripts/rune-release.ts sign dist/Lyre_universal.app.tar.gz darwin-x86_64
          bun scripts/rune-release.ts sign dist/Lyre_universal.app.tar.gz darwin-aarch64

      - name: Upload installer and fragment
        uses: actions/upload-artifact@v4
        with:
          name: rune-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.app.tar.gz
            dist/*.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rune-*
          merge-multiple: true
          path: dist

      # The changelog is the release notes, so the draft is built from it rather
      # than a second copy that can drift.
      - name: Release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { copying = 1; next }
            copying && /^## \[/ { exit }
            copying { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section for $VERSION; see the assets below." > notes.md
          fi

      - name: Merge the update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun scripts/rune-release.ts manifest "$VERSION" notes.md dist/latest.json dist/*.json

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "A fast, cross-platform file manager in the Windows 11 Explorer design language."
            echo
            echo '| Platform | File |'
            echo '| --- | --- |'
            echo '| Linux | `Lyre_<version>_amd64.AppImage` (no install) |'
            echo '| Windows | `Lyre_<version>_x64-setup.exe` (NSIS) |'
            echo '| macOS | `Lyre_universal.app.tar.gz` (Apple silicon and Intel) |'
            echo
            echo "Nothing is code-signed yet. On Windows expect a SmartScreen prompt"
            echo "(More info, then Run anyway); on macOS the app is unsigned and not"
            echo "notarised, so the first launch needs a right-click and Open."
            echo
            echo "---"
            echo
            cat notes.md
          } > body.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Lyre $GITHUB_REF_NAME" \
            --notes-file body.md \
            dist/*.AppImage dist/*-setup.exe dist/*.app.tar.gz dist/latest.json
