[package]
name = "lyre"
version = "0.1.0"
description = "A fast, cross-platform file manager in the Windows 11 design language."
authors = ["Lyre contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lyre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed the frontend instead of loading a development URL.
# `tauri dev` passes --no-default-features, so development is unaffected.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nucleo-matcher = "0.3.1"
tauri-plugin-drag = "2.1.1"

# A file manager's start-up time is a feature. Optimise hard for binary size
# and code locality rather than peak throughput.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

# Listing a directory is the hot path, and it is still slow in debug builds
# with the default opt-level = 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
